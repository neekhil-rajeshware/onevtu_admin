# The Flutter template asks for -Xmx8G. This machine has 16 GB and often has a
# second Gradle daemon alive for the student app, and two 8 GB heaps crash the
# JVM outright ("insufficient memory ... for G1 virtual space"). This app is
# eight plugins and no native code, so 3 GB is more than enough.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=320m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
